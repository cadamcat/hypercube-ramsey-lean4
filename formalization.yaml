# formalization.yaml (v0.4)
version: "v0.4"

project:
  name: "A Lean 4 formalization of the linear hypercube Ramsey bound (Erdős problem 181)"
  description: >-
    A complete Lean 4 formalization of OpenAI's theorem that the hypercube
    Ramsey number has linear order: an absolute constant C > 0 bounds the
    diagonal Ramsey number of the n-dimensional hypercube Q_n by C * 2^n for
    every natural n. The target is Erdos181.erdos_181 as stated in Google
    DeepMind's Formal Conjectures. The formal proof follows OpenAI's paper. It
    takes the cube, its Ramsey number, finite Ramsey bounds and the paper's
    counterexample-sequence lemma (Lemma 2.1) from OpenAI's Lean library
    openai/math, and formalizes the rest of the paper, Sections 3 to 18, which
    show that no counterexample sequence exists. The final theorem depends
    only on the axioms propext, Classical.choice and Quot.sound.
  authors:
    - "Yao Xu"
  responsible_maintainers:
    - "Yao Xu"
  license: "Apache-2.0"

sources:
  - title: "The hypercube Ramsey number has linear order"
    authors: ["OpenAI"]
    id: "https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/The-hypercube-Ramsey-number-has-linear-order-September-23-2026/paper.pdf"
    type: "paper"
    location: "September 23, 2026; Theorem 1.1 (thm:main), proved in Sections 2–18"
    relationship: "formalizes"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/9d259649abe0b02d7a25f7589b872db679b35e21/FormalConjectures/ErdosProblems/181.lean"
    relationship: "other"
    note: >-
      Formal Conjectures states Erdos181.erdos_181 with sorry. Challenge.lean
      copies that statement and the definitions it uses (SimpleGraph.hypercube,
      SimpleGraph.graphRamsey, SimpleGraph.diagonalGraphRamsey) from commit
      9d259649abe0b02d7a25f7589b872db679b35e21; this repository proves it.
  - id: "https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a/lean"
    relationship: "builds-on"
    note: >-
      The project imports OAI.Combinatorics.Ramsey.Hypercube, which supplies
      the cube graph, the Ramsey number, finite Ramsey bounds, cross-edge
      colourings and the counterexample sequence of the paper's Lemma 2.1
      (OAI.HypercubeRamsey.counterexample_sequence_of_not_linear). No OpenAI
      source is copied.

classification:
  arxiv: ["math.CO", "cs.LO"]
  msc2020: ["05C55", "05D10", "68V20"]

status:
  scope: >-
    Complete formalization of Erdos181.erdos_181 in the form stated in
    Challenge.lean, for every natural n including 0, over the definitions
    copied from Formal Conjectures.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Erdos181.erdos_181"
      file: "HypercubeRamsey/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Challenge.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "GPT-6 Luna", "GPT-6.1 Sol", "Gemini 3.8 Flash"]
      framework: "Claude Code, Codex CLI and Antigravity CLI"
      tool_setup: >-
        AI coding agents wrote the Lean code under acceptance criteria set by
        the author. The target statement was copied from Formal Conjectures
        first and reviewed against the paper. A blueprint split the
        paper into intermediate Lean statements; each was frozen with a hash
        of its elaborated type before any proof of it was attempted, and
        statements were attacked for counterexamples, with those found false
        repaired and frozen again. A proof was accepted only if its statement
        kept the frozen type and its axioms stayed within the three standard
        axioms, up to frozen statements still open.
      cost:
        spend_usd: "subscription-based usage"
        hardware: "API-only models; builds on an Apple Silicon Mac and on remote Linux build servers"
  spend_usd: "subscription-based usage"
  notes: >-
    The author is responsible for the content. Model agreement was not
    treated as verification; acceptance rests on the Lean kernel checks
    described under review.

fidelity:
  divergences: >-
    None in the meaning of the statement. Challenge.lean copies Formal
    Conjectures' statement and definitions verbatim, except that it drops the
    module-system wrappers, the category attribute and a TODO comment, imports
    real numbers from Mathlib.Basic.Real.Basic (the current path of the
    deprecated Mathlib.Data.Real.Basic at the project's Mathlib pin), and
    merges the two definition files into one block without the other
    declarations of Ramsey.lean. The Ramsey number is an sInf; for the cube
    the set of sizes is nonempty and excludes 0, so it equals OpenAI's
    least-positive Ramsey number (HypercubeRamsey.diagonalGraphRamsey_hypercube),
    and the lower bound 2^n is checked in Audit/TargetProbes.lean. A copy is
    an injective homomorphism and need not be induced, as in the paper.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    scripts/verify.sh builds the theorem, checks that the copied definitions
    are identical in Challenge.lean and the proof, compares the elaborated
    statement and definitions of both modules printed with pp.all, and
    checks that Erdos181.erdos_181 depends only on propext,
    Classical.choice and Quot.sound. Audit/IndependentRestatement.lean proves
    the target equivalent to a restatement of Theorem 1.1 that uses neither
    the Formal Conjectures nor the OpenAI definitions. Every intermediate
    statement was frozen with a hash of its elaborated type before its
    proof. No independent human expert has reviewed the formalization.

alignment:
  namespace: "Erdos181"
  statements:
    - source: "OpenAI (2026), Theorem 1.1 (thm:main); Formal Conjectures Erdos181.erdos_181"
      lean: "Erdos181.erdos_181"
      module: "HypercubeRamsey/Main.lean"
      status: "proved"

acknowledgements: >-
  Mathlib and OpenAI's openai/math library supply the underlying theories;
  the target statement and its definitions come from Google DeepMind's
  Formal Conjectures. Their authors and licenses are credited in
  THIRD_PARTY.md and NOTICE.
