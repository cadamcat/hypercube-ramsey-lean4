# formalization.yaml (v0.4)
version: "v0.4"

project:
  name: "The hypercube Ramsey number has linear order in Lean 4"
  description: >-
    A Lean 4 formalization of Formal Conjectures' Erdos181.erdos_181: an
    absolute constant C > 0 bounds the diagonal Ramsey number of the
    n-dimensional hypercube by C * 2^n for every natural n. The proof uses
    OpenAI's openai/math Ramsey and hypercube library. The formalization
    records the result proved in OpenAI's paper and claims no new mathematics.
  authors:
    - "Yao Xu"
  license: "Apache-2.0"

sources:
  - title: "The hypercube Ramsey number has linear order"
    authors: ["OpenAI"]
    id: "https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/The-hypercube-Ramsey-number-has-linear-order-September-23-2026/paper.pdf"
    type: "paper"
    location: "The theorem bounding the diagonal Ramsey number of Q_n by C * 2^n"
    relationship: "formalizes"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/tree/9d259649abe0b02d7a25f7589b872db679b35e21"
    relationship: "formalizes"
    note: >-
      The target is Formal Conjectures' Erdos181.erdos_181. The graph
      definitions used by the challenge and proof are copied from that commit.
  - id: "https://github.com/openai/math/tree/adc7f1241b42e322a6451854ab7e4b4c146bf78a/lean"
    relationship: "builds-on"
    note: >-
      The project imports OAI.Combinatorics.Ramsey.Hypercube, which supplies
      the cube and Ramsey-number definitions and finite Ramsey and
      cross-colouring results used by the proof.

